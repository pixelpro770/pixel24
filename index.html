<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Pure HD - Pro AI Restoration</title>
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    <style>
        :root {
            --primary: #00d2ff;
            --bg: #000000;
            --card: #111111;
            --text: #ffffff;
        }

        body {
            font-family: 'SF Pro Display', -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header { text-align: center; padding: 40px 20px; }
        .header h1 { font-size: 2.5rem; margin: 0; background: linear-gradient(to right, #fff, #777); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .main-container {
            width: 95%;
            max-width: 500px;
            background: var(--card);
            padding: 20px;
            border-radius: 24px;
            border: 1px solid #333;
            text-align: center;
            margin-bottom: 50px;
        }

        /* REMINI STYLE SLIDER */
        .comparison-slider {
            position: relative;
            width: 100%;
            aspect-ratio: 4/5;
            overflow: hidden;
            border-radius: 16px;
            margin-bottom: 20px;
            cursor: ew-resize;
            border: 1px solid #444;
        }

        .image-after {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }

        .image-before {
            position: absolute;
            top: 0;
            left: 0;
            width: 50%; /* Initial split */
            height: 100%;
            overflow: hidden;
            border-right: 3px solid var(--primary);
        }

        .image-before img {
            width: 500px; /* Match max-width */
            height: 100%;
            object-fit: cover;
            display: block;
            filter: blur(4px); /* For the attraction image */
        }

        /* SLIDER HANDLE */
        .handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(0,210,255,0.5);
            pointer-events: none;
        }

        #upload-btn {
            background: var(--primary);
            color: black;
            border: none;
            padding: 15px 30px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        /* PROCESSING MODAL */
        #loader-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .spinner {
            border: 4px solid #333;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 50px; height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        #download-btn {
            display: none;
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pixel Pure HD</h1>
    </div>

    <div class="main-container">
        <div class="comparison-slider" id="slider">
            <img id="after-img" class="image-after" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=500" alt="HD">
            
            <div class="image-before" id="before-box">
                <img id="before-img" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=500" alt="Blur">
            </div>

            <div class="handle" id="handle">↔</div>
        </div>

        <button id="upload-btn">Start Photo Enhancement</button>
        <a id="download-btn" href="#" download="pixel_pure_hd.jpg">Download HD Image</a>
    </div>

    <div id="loader-modal">
        <div class="spinner"></div>
        <h2 style="margin-top:20px;">Reconstructing the details...</h2>
        <p style="color:#888;">Please don't close the app.</p>
    </div>

    <script>
        const slider = document.getElementById('slider');
        const beforeBox = document.getElementById('before-box');
        const handle = document.getElementById('handle');

        // SLIDER LOGIC (Phone par mast chalega)
        function moveSlider(e) {
            let x = (e.pageX || e.touches[0].pageX) - slider.getBoundingClientRect().left;
            let w = slider.offsetWidth;
            if (x < 0) x = 0;
            if (x > w) x = w;
            let percent = (x / w) * 100;
            beforeBox.style.width = percent + '%';
            handle.style.left = percent + '%';
        }

        slider.addEventListener('mousemove', moveSlider);
        slider.addEventListener('touchmove', moveSlider);

        // CLOUDINARY LOGIC
        const myWidget = cloudinary.createUploadWidget({
            cloudName: "dnzcfwjqt", 
            uploadPreset: "unsigned_preset",
            sources: ['local'],
            multiple: false
        }, (error, result) => {
            if (!error && result && result.event === "success") {
                document.getElementById('loader-modal').style.display = 'flex';
                
                const rawUrl = result.info.secure_url;
                const hdUrl = rawUrl.replace("/upload/", "/upload/f_auto,q_auto:best,e_upscale,e_improve/");

                const img = new Image();
                img.src = hdUrl;
                img.onload = () => {
                    document.getElementById('before-img').src = rawUrl;
                    document.getElementById('after-img').src = hdUrl;
                    document.getElementById('before-img').style.filter = "none";
                    document.getElementById('download-btn').href = hdUrl;
                    document.getElementById('download-btn').style.display = 'block';
                    document.getElementById('loader-modal').style.display = 'none';
                    beforeBox.style.width = '50%'; // Reset slider
                    handle.style.left = '50%';
                };
            }
        });

        document.getElementById("upload-btn").addEventListener("click", () => myWidget.open());
    </script>
</body>
</html>
